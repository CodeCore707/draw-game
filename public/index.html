<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/socket.io/socket.io.js"></script>
<style>
body { font-family: sans-serif; text-align:center; margin:0; }
canvas { border:1px solid black; width:95vw; max-width:600px; height:60vh; }
#scoreboard { margin:10px; }
button { padding:10px; margin:5px; }
input { padding:8px; }
</style>
</head>
<body>

<h2>🎨 Draw Battle</h2>

<div id="menu">
<input id="name" placeholder="이름">
<button onclick="createRoom()">방 만들기</button>
<input id="roomCode" placeholder="방 코드">
<button onclick="joinRoom()">입장</button>
</div>

<h3 id="roomInfo"></h3>
<p id="info"></p>
<p>⏳ <span id="timer">60</span></p>

<canvas id="board"></canvas>

<div>
<input id="chatInput" placeholder="정답 입력">
<button onclick="sendChat()">전송</button>
</div>

<div id="scoreboard"></div>

<script>
const socket = io();
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

let drawing=false, canDraw=false, roomCode="";

canvas.addEventListener("mousedown",()=>drawing=true);
canvas.addEventListener("mouseup",()=>drawing=false);
canvas.addEventListener("mousemove",(e)=>{
 if(!drawing||!canDraw)return;
 const rect=canvas.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;
 ctx.fillRect(x,y,3,3);
 socket.emit("draw",{code:roomCode,data:{x,y}});
});

socket.on("draw",(data)=>ctx.fillRect(data.x,data.y,3,3));

function createRoom(){
 const name=document.getElementById("name").value;
 socket.emit("createRoom",name);
}

function joinRoom(){
 const name=document.getElementById("name").value;
 roomCode=document.getElementById("roomCode").value.toUpperCase();
 socket.emit("joinRoom",{code:roomCode,name});
 document.getElementById("roomInfo").innerText="방 코드: "+roomCode;
}

socket.on("roomCreated",(code)=>{
 roomCode=code;
 document.getElementById("roomInfo").innerText="방 코드: "+code;
});

function sendChat(){
 const msg=document.getElementById("chatInput").value;
 socket.emit("chat",{code:roomCode,msg});
 document.getElementById("chatInput").value="";
}

socket.on("updateUsers",(users)=>{
 let html="<h3>🏆 점수판</h3>";
 for(const id in users){
   html+=users[id].name+" : "+users[id].score+"점<br>";
 }
 document.getElementById("scoreboard").innerHTML=html;
});

socket.on("newRound",(data)=>{
 ctx.clearRect(0,0,canvas.width,canvas.height);
 document.getElementById("info").innerText="단어 길이: "+data.wordLength;
 canDraw=false;
});

socket.on("yourTurn",(word)=>{
 document.getElementById("info").innerText="그릴 차례! 단어: "+word;
 canDraw=true;
});

socket.on("timer",(time)=>{
 document.getElementById("timer").innerText=time;
});

socket.on("roundEnd",(word)=>{
 alert("라운드 종료! 정답: "+word);
 canDraw=false;
});
</script>

</body>
</html>
